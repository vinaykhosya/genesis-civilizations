<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Minimalist Geometric Scientific Logo for Genesis -->
  
  <!-- Grid Coordinates (Observed Space) -->
  <line x1="10" y1="50" x2="90" y2="50" stroke="#1f2937" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="50" y1="10" x2="50" y2="90" stroke="#1f2937" stroke-width="1" stroke-dasharray="2 2" />
  
  <!-- Concentric Outer Ring (Boundary of Ecosystem) -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#374151" stroke-width="1.5" />
  
  <!-- Active Evolution Arc -->
  <path d="M 50 14 A 36 36 0 0 1 86 50" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" />
  
  <!-- Core Origin (The Initial Seed) -->
  <circle cx="50" cy="50" r="4" fill="#14b8a6" />
  
  <!-- Emergence Vectors (Attachment/Kinship Lines) -->
  <circle cx="50" cy="30" r="8" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="67" cy="60" r="8" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="33" cy="60" r="8" fill="none" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Vector Linkages -->
  <line x1="50" y1="38" x2="50" y2="46" stroke="#9ca3af" stroke-width="1" />
  <line x1="43" y1="54" x2="38" y2="56" stroke="#9ca3af" stroke-width="1" />
  <line x1="57" y1="54" x2="62" y2="56" stroke="#9ca3af" stroke-width="1" />
</svg>
